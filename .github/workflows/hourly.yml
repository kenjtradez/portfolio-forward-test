name: Hourly Signals (ADX+Supertrend, 12 pairs)

on:
  schedule:
    - cron: '5 * * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas requests numpy
      - name: Run hourly signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: ${{ secrets.OANDA_ENVIRONMENT }}
        run: python hourly_signals.py
      - name: Commit updated logs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hourly_price_log.csv hourly_state.json equity.json journal.csv
          git diff --staged --quiet || git commit -m "Hourly signal update $(date -u +%Y-%m-%dT%H:%M)"
          git push
