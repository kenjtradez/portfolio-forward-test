name: TGA Daily Signal (alert only, no trading)

on:
  schedule:
    - cron: '45 22 * * 1-5'
  workflow_dispatch: {}

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests numpy

      - name: Run TGA daily signal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tga_daily_signal.py

      - name: Commit updated log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tga_log.csv
          git diff --staged --quiet || git commit -m "Update TGA daily signal log"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
