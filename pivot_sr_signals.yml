name: Pivot S/R (NAS100)

on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch: {}

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests numpy

      - name: Run Pivot S/R signals
        run: python pivot_sr_signals.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nas100_signal_log.csv nas100_state.json equity.json journal.csv
          git diff --staged --quiet || git commit -m "Update Pivot S/R state"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
